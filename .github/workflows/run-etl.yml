name: Run ETL (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (offline test, no API calls)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        working-directory: etl
        run: pip install -r requirements.txt

      - name: Run ETL (offline test)
        if: inputs.dry_run
        working-directory: etl
        run: python test_etl_offline.py

      - name: Fetch API keys from SSM
        if: '!inputs.dry_run'
        run: |
          echo "BLS_API_KEY=$(aws ssm get-parameter --name /rcof/bls-api-key --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV
          echo "FDC_API_KEY=$(aws ssm get-parameter --name /rcof/fdc-api-key --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV

      - name: Run ETL
        if: '!inputs.dry_run'
        working-directory: etl
        run: python run_etl.py

      - name: Upload data export to S3
        if: '!inputs.dry_run'
        run: |
          aws s3 cp data/foods_export.json s3://${{ secrets.DATA_BUCKET_NAME }}/foods_export.json \
            --content-type application/json

      - name: Trigger site rebuild
        if: '!inputs.dry_run'
        run: |
          gh workflow run deploy-site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
