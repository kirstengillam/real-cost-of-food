name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/foods_export.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: # also triggered by Lambda after ETL run

permissions:
  id-token: write  # needed for OIDC auth
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Download the latest foods_export.json from S3 so the build always uses
      # the freshest data, not whatever's committed in the repo.
      - name: Download latest data export
        run: |
          aws s3 cp s3://${{ secrets.DATA_BUCKET_NAME }}/foods_export.json data/foods_export.json
        # Falls back to the committed file if the bucket is empty (first deploy)
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          ADSENSE_ID: ${{ secrets.ADSENSE_ID }}
        run: npm run build

      - name: Sync to S3
        run: |
          aws s3 sync site/dist/ s3://${{ secrets.SITE_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap*.xml"
          # HTML and sitemaps get short cache so content updates propagate quickly
          aws s3 sync site/dist/ s3://${{ secrets.SITE_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=300" \
            --include "*.html" \
            --include "sitemap*.xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
