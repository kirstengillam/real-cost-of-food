name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/foods_export.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: # also triggered by Lambda after ETL run

permissions:
  id-token: write  # needed for OIDC auth
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Download the latest foods_export.json from S3 so the build always uses
      # the freshest data, not whatever's committed in the repo.
      - name: Download latest data export
        run: |
          aws s3 cp s3://${{ secrets.DATA_BUCKET_NAME }}/foods_export.json data/foods_export.json
        # Falls back to the committed file if the bucket is empty (first deploy)
        continue-on-error: true

      # ── RAG: rebuild embeddings and redeploy Lambda ───────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RAG dependencies
        run: pip install voyageai

      - name: Fetch Voyage API key from SSM
        run: |
          echo "VOYAGE_API_KEY=$(aws ssm get-parameter --name /rcof/voyage-api-key --with-decryption --query Parameter.Value --output text)" >> $GITHUB_ENV

      - name: Build chunks and embeddings
        run: |
          python rag/build_chunks.py
          python rag/embed_and_store.py

      - name: Upload embeddings to S3
        run: |
          aws s3 cp rag/embeddings.json \
            s3://${{ secrets.DATA_BUCKET_NAME }}/rag/embeddings.json \
            --content-type application/json

      - name: Package RAG Lambda zip
        run: |
          LAMBDA_BUILD=$(mktemp -d)
          pip install voyageai anthropic -t "$LAMBDA_BUILD" --quiet
          cp rag/lambda_handler.py "$LAMBDA_BUILD/"
          cd "$LAMBDA_BUILD" && zip -r "$GITHUB_WORKSPACE/rag_lambda.zip" . -q

      - name: Upload RAG Lambda zip to S3
        run: |
          aws s3 cp rag_lambda.zip \
            s3://${{ secrets.DATA_BUCKET_NAME }}/rag/lambda.zip

      - name: Deploy RAG Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.RAG_FUNCTION_NAME }} \
            --s3-bucket ${{ secrets.DATA_BUCKET_NAME }} \
            --s3-key rag/lambda.zip \
            --no-cli-pager

      - name: Inject API keys into RAG Lambda environment
        run: |
          ANTHROPIC_KEY=$(aws ssm get-parameter --name /rcof/anthropic-api-key --with-decryption --query Parameter.Value --output text)
          aws lambda update-function-configuration \
            --function-name ${{ secrets.RAG_FUNCTION_NAME }} \
            --environment "Variables={VOYAGE_API_KEY=$VOYAGE_API_KEY,ANTHROPIC_API_KEY=$ANTHROPIC_KEY,DATA_BUCKET=${{ secrets.DATA_BUCKET_NAME }}}" \
            --no-cli-pager
      # ─────────────────────────────────────────────────────────────────────────

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          ADSENSE_ID: ${{ secrets.ADSENSE_ID }}
          PUBLIC_RAG_URL: ${{ secrets.RAG_FUNCTION_URL }}
        run: npm run build

      - name: Sync to S3
        run: |
          aws s3 sync site/dist/ s3://${{ secrets.SITE_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap*.xml"
          # HTML and sitemaps get short cache so content updates propagate quickly
          aws s3 sync site/dist/ s3://${{ secrets.SITE_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=300" \
            --include "*.html" \
            --include "sitemap*.xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
